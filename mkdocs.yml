site_name: CryptoPulse · Grupo 3
site_description: Monitoreo de riesgo de BTC y SOL con arquitectura Lambda (Big Data UPeU 2026-2)
site_author: Grupo 3 · CryptoPulse
site_url: https://milagros-hp.github.io/BigData-BTC-SOL/
repo_url: https://github.com/Milagros-hp/BigData-BTC-SOL
repo_name: Milagros-hp/BigData-BTC-SOL
edit_uri: edit/main/docs/
docs_dir: docs

nav:
  - Inicio: index.md
  - Exposición U2:
      - Pitch: u2/index.md
      - Sesiones S6 a S12: u2/sesiones.md
      - Franck · Volatilidad: u2/franck.md
      - Julmer · Caídas y streaming: u2/julmer.md
      - Abdul · Actividad y observabilidad: u2/abdul.md
      - Luz Milagros · Separación y BI: u2/luz.md
      - Guion de la demo: u2/demo.md
  - Proyecto Sello:
      - Guía del proyecto: proyecto-sello/index.md
      - Brief técnico-analítico: proyecto-sello/brief.md
      - Producto U1: proyecto-sello/u1-producto.md
      - Producto U2: proyecto-sello/u2-producto.md
      - Producto U3 / final: proyecto-sello/u3-producto.md
  - Unidad 1 · Batch:
      - Notebooks por integrante: notebooks-u1.md
      - Bitácora S01–S12: INFORME_SESIONES_S01_S12.md
  - Unidad 2 · Tiempo real:
      - Uso del tablero: PRODUCTO_FINAL.md
      - Informe técnico y arquitectura: INFORME_PROYECTO_CRYPTOPULSE.md
  - Unidad 3 · DataOps:
      - Instalación y ejecución: instalacion.md
      - Pruebas y hardening: hardening.md
      - Evidencias: evidencias/README.md
      - Limitaciones y mejoras: limitaciones.md
  - Equipo:
      - Equipo y aporte individual: equipo.md
      - Repositorio y estándares: repositorio.md
      - Guía de cambios: GUIA_DE_CAMBIOS.md
      - Anexos:
          - Guía de inicio local: GUIA_INICIO_LOCAL.md
          - Revisión del tablero: REVISION_PROYECTO_Y_GUIA_GRAFANA.md

# Diseño adaptado del sitio de Abdul Quispe (abdul8377/big-data-btc-sol).
theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search:
      lang: es

extra_css:
  - assets/stylesheets/extra.css
  - stylesheets/pitch.css

copyright: © 2026 · CryptoPulse · Grupo 3 · Big Data UPeU
